<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Koyja - Чит</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            overflow: hidden;
            position: relative;
        }

        /* Анимированный фон */
        body::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(138, 43, 226, 0.15) 0%, transparent 70%);
            animation: rotate 20s linear infinite;
        }

        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .container {
            position: relative;
            z-index: 1;
            text-align: center;
            padding: 60px 80px;
            background: rgba(20, 20, 40, 0.7);
            backdrop-filter: blur(20px);
            border-radius: 30px;
            border: 1px solid rgba(138, 43, 226, 0.3);
            box-shadow: 0 0 60px rgba(138, 43, 226, 0.3), inset 0 0 60px rgba(138, 43, 226, 0.05);
            animation: float 6s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .logo {
            font-size: 72px;
            font-weight: 900;
            letter-spacing: 8px;
            background: linear-gradient(135deg, #a855f7, #6366f1, #ec4899);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
            text-shadow: 0 0 40px rgba(168, 85, 247, 0.5);
            animation: glow 2s ease-in-out infinite alternate;
        }

        @keyframes glow {
            from { filter: drop-shadow(0 0 20px rgba(168, 85, 247, 0.6)); }
            to { filter: drop-shadow(0 0 40px rgba(99, 102, 241, 0.8)); }
        }

        .subtitle {
            color: rgba(200, 200, 255, 0.6);
            font-size: 18px;
            margin-bottom: 50px;
            letter-spacing: 2px;
        }

        .download-btn {
            display: inline-flex;
            align-items: center;
            gap: 15px;
            padding: 20px 50px;
            font-size: 22px;
            font-weight: 700;
            color: #fff;
            background: linear-gradient(135deg, #7c3aed, #4f46e5);
            border: none;
            border-radius: 60px;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.3s ease;
            box-shadow: 0 10px 30px rgba(124, 58, 237, 0.4);
            position: relative;
            overflow: hidden;
        }

        .download-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: left 0.5s ease;
        }

        .download-btn:hover::before {
            left: 100%;
        }

        .download-btn:hover {
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 15px 40px rgba(124, 58, 237, 0.6);
        }

        .download-btn:active {
            transform: translateY(-1px) scale(1.02);
        }

        .download-btn svg {
            width: 28px;
            height: 28px;
            fill: currentColor;
            animation: bounce 2s ease-in-out infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-4px); }
        }

        .version {
            color: rgba(200, 200, 255, 0.4);
            font-size: 14px;
            margin-top: 25px;
            letter-spacing: 1px;
        }

        /* Мерцающие частицы */
        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: #a855f7;
            border-radius: 50%;
            pointer-events: none;
            opacity: 0.5;
            animation: particleFloat linear infinite;
        }

        @keyframes particleFloat {
            from { transform: translateY(100vh) scale(0); opacity: 0; }
            10% { opacity: 0.5; }
            90% { opacity: 0.5; }
            to { transform: translateY(-10vh) scale(1); opacity: 0; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="logo">KOYJA</h1>
        <p class="subtitle">ЧИТ ДЛЯ ИГР</p>
        
        <a href="koyja-1.3.6.exe" download class="download-btn">
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path d="M12 16l-5-5h3V4h4v7h3l-5 5zm-7 2h14v2H5v-2z"/>
            </svg>
            Скачать koyja-1.3.6
        </a>
        
        <p class="version">Версия: 1.3.6 | Размер: 4.2 MB</p>
    </div>

    <script>
        // Создание мерцающих частиц на фоне
        function createParticles() {
            const count = 30;
            for (let i = 0; i < count; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.width = particle.style.height = (Math.random() * 4 + 2) + 'px';
                particle.style.animationDuration = (Math.random() * 8 + 6) + 's';
                particle.style.animationDelay = (Math.random() * 10) + 's';
                particle.style.background = ['#a855f7', '#6366f1', '#ec4899'][Math.floor(Math.random() * 3)];
                document.body.appendChild(particle);
            }
        }
        createParticles();

        // Обработка клика по кнопке скачивания
        document.querySelector('.download-btn').addEventListener('click', function(e) {
            // Можно добавить дополнительную логику, например уведомление
            console.log('Начинается загрузка koyja-1.3.6.exe');
        });
    </script>
</body>
</html>
